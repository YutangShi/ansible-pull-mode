- name: Install common packages
  apt:
    name:
      - htop
      - nano
      - vim-tiny
      - git
      - logrotate
    state: present
    update_cache: yes

- name: Copy metrics.sh to local host
  copy:
    src: metrics.sh
    dest: /metrics.sh
    mode: '0755'

- name: Copy metrics.sh to local host with encrypted variables
  template:
    src: metrics.sh.j2
    dest: /metrics2.sh
    mode: '0755'

- name: Debug - Show metrics.sh exists
  stat:
    path: /metrics.sh
  register: metrics_file

- name: Debug - Output metrics file status
  debug:
    var: metrics_file

- name: Create initial ansible pull log file
  file:
    path: "/var/log/ansible-pull.log"
    state: touch
    mode: '0644'
  changed_when: false

- name: Copy logrotate configuration for ansible-pull logs
  copy:
    src: ansible-pull-logrotate
    dest: /etc/logrotate.d/ansible-pull
    owner: root
    group: root
    mode: '0644'

- name: Install ufw
  apt:
    name: ufw
    state: present
    update_cache: yes

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow HTTP
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable ufw
  ufw:
    state: enabled

- name: Install fail2ban
  apt:
    name: fail2ban
    state: present
    update_cache: yes

- name: Enable and start fail2ban
  systemd:
    name: fail2ban
    enabled: yes
    state: started
